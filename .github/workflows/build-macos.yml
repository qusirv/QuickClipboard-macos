# ============================================================
# QuickClipboard - macOS 自动构建工作流
# ------------------------------------------------------------
# 用法：
#   1. 在 GitHub 新建一个仓库（私有/公开均可）
#   2. 把 QuickClipboard 源码推上去（确保 .github/workflows/build-macos.yml
#      位于仓库根目录下）
#   3. 仓库 Actions 页面 -> 左侧选中 "Build macOS" -> 右侧 "Run workflow"
#      （之后每次打 v* 开头的 tag 也会自动触发）
#   4. 等 30~60 分钟（Rust 全量编译较慢），构建完成后在 Actions 运行
#      记录页底部下载 artifact（.dmg 安装包）
#
# 本工作流基于已适配 macOS 的源码构建（适配已直接提交到仓库）：
#   [1] lib.rs / main.rs：windows_subsystem 属性已加 windows 条件
#   [2] Cargo.toml：winreg / qcocr / file_icon_provider 已移入
#       [target.'cfg(windows)'.dependencies] 段（Windows 专属依赖）
#   [3] 代码：OCR / 文件图标 / 注册表安装检测等 Windows 专属功能
#       已改为 cfg 双版本（macOS 上优雅降级）
# 仅剩打包目标（nsis 仅 Windows）由本工作流在运行时改为 app/dmg。
# 之后使用作者自带的社区构建脚本（community-build.js），
# 自动剔除 screenshot-suite / gpu-image-viewer 两个私有插件。
# ============================================================

name: Build macOS

on:
  workflow_dispatch:      # 手动触发
  push:
    tags:
      - 'v*'              # 打 tag 自动触发

jobs:
  build-macos:
    # 默认 Intel (x64) runner。需要 Apple Silicon 原生包时：
    # 换成 ARM64 版 macOS runner，并把 rust target 改为 aarch64-apple-darwin
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        # 注意：不带 --recurse-submodules。screenshot-suite 子模块为空目录，
        # 社区构建脚本会直接从依赖中剔除它，无需拉取。

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm ci

      # --------------------------------------------------------
      # 打包目标调整：tauri.conf.json 的默认目标 nsis 仅适用于
      # Windows，这里在 macOS 构建机上运行时改为 app/dmg，
      # 并关闭 updater 签名产物（不影响仓库本身的跨平台配置）。
      # --------------------------------------------------------
      - name: Set macOS bundle targets
        run: |
          set -e

          python3 - <<'PY'
          import json
          p = 'src-tauri/tauri.conf.json'
          d = json.load(open(p, encoding='utf-8'))
          d['bundle']['targets'] = ['app', 'dmg']
          d['bundle']['createUpdaterArtifacts'] = False
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(d, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print('[patch] tauri.conf.json: targets=app,dmg, updater artifacts off')
          PY

      # --------------------------------------------------------
      # 社区版构建：自动剔除私有插件（screenshot-suite、
      # gpu-image-viewer），以 --no-default-features 编译。
      # 构建过程中脚本会自动还原被修改的 Cargo.toml 等文件。
      # --------------------------------------------------------
      - name: Build (community edition)
        run: npm run tauri:build:community
        env:
          # 首次构建量大，避免被 runner 判定超时
          CI: 'true'

      # --------------------------------------------------------
      # 上传产物：.dmg 安装包 + .app（macOS 应用本体）
      # 构建成功后到本次运行的 Artifacts 区域下载
      # --------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickClipboard-macOS-x64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14
